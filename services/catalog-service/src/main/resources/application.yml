spring:
  application:
    name: catalog-service
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/catalog}
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

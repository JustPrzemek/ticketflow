# Local infrastructure for development: `docker compose up -d`
services:
  mongodb:
    image: mongo:9.0  # 8.0 does not start on Linux kernel 6.19+ (SERVER-121912)
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb-data:

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A newer PR commit makes the old run pointless, but on main every commit must publish its image.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: SonarQube needs it for blame data and to tell new code from old.
          fetch-depth: 0

      - name: Set up JDK (keep in sync with mise.toml)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build, unit tests, integration tests (Testcontainers)
        run: ./mvnw -B -ntp verify

      - name: Cache SonarQube analyzers
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}

      # Reuses classes and JaCoCo reports from the step above. The quality gate result comes back
      # as a separate check on the PR, posted by the SonarQube Cloud GitHub app.
      # Pull requests from forks get no secrets, so they are skipped instead of failing.
      - name: SonarQube Cloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::SONAR_TOKEN is not available - analysis skipped"
            exit 0
          fi
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: "**/target/*-reports/TEST-*.xml"
          check_name: Test report
          include_passed: true

  image:
    name: Image (catalog-service)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/justprzemek/ticketflow-catalog-service
    steps:
      - uses: actions/checkout@v7

      # Only the last Dockerfile stage is per-platform and it has no RUN, so no QEMU is needed.
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: full commit SHA (what deployments reference) + latest on main. Also adds OCI labels,
      # incl. org.opencontainers.image.source, which links the GHCR package to this repository.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      # PRs only build (catches a broken Dockerfile); pushes to main also publish.
      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/catalog-service/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=catalog-service
          cache-to: type=gha,mode=max,scope=catalog-service
